services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    # Re-enable when ready
    # restart: unless-stopped
    restart: "no"
    ports:
      - "${WAHA_PUBLIC_PORT}:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_API_KEY=${WAHA_API_KEY}
      # Uncomment the following line if to disable DASHBOARD access
      # - WAHA_DASHBOARD_ENABLED=false
      - WAHA_DASHBOARD_USERNAME=${WAHA_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_PASSWORD}
      - WAHA_CLIENT_DEVICE_NAME=${HOSTNAME}
      - WAHA_CLIENT_BROWSER_NAME=Desktop
      - WHATSAPP_SWAGGER_ENABLED=false
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WHATSAPP_HOOK_RETRIES_POLICY=linear
      - WHATSAPP_HOOK_RETRIES_DELAY_SECONDS=3
      - WHATSAPP_HOOK_RETRIES_ATTEMPTS=20
      - WAHA_HTTPS_ENABLED=true
      - WAHA_HTTPS_PATH_CERT=/app/certs/fullchain.pem
      - WAHA_HTTPS_PATH_KEY=/app/certs/privkey.pem
      - WAHA_HTTPS_PATH_CA=/app/certs/fullchain.pem
    volumes:
      - ./sessions:/app/.sessions
      - ~/.config/botcert:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({hostname:'localhost',port:3000,path:'/ping',rejectUnauthorized:false}, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  waha-proxy:
    build: ./proxy
    container_name: waha-proxy
    # Re-enable when ready
    # restart: unless-stopped
    restart: "no"
    depends_on:
      waha:
        condition: service_healthy
    ports:
      - "${BOT_PUBLIC_PORT}:${BOT_PUBLIC_PORT}"
    env_file:
      - .env
    environment:
      - HOST_SHARED_TMP=${PWD}/shared-tmp
      - WAHA_CLIENT_DEVICE_NAME=${HOSTNAME}
    volumes:
      - /run/signal-cli:/run/signal-cli
      - ./data:/app/data:ro
      - ./polldb:/app/polldb
      - ./.env.example:/app/.env.example:ro
      - ~/.config/botcert:/app/certs:ro
      - ./shared-tmp:/shared-tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
