services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_PASSWORD}
      - WAHA_CLIENT_DEVICE_NAME=${WAHA_DEVICENAME}
      - WAHA_CLIENT_BROWSER_NAME=Desktop
#      - WAHA_HMAC_SECET=${WAHA_HMAC_SECRET}
      - WHATSAPP_SWAGGER_ENABLED=false
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WAHA_HTTPS_ENABLED=true
      - WAHA_HTTPS_PATH_CERT=/app/certs/fullchain.pem
      - WAHA_HTTPS_PATH_KEY=/app/certs/privkey.pem
    volumes:
      - ./sessions:/app/.sessions
      - ~/.config/botcert:/app/certs:ro

